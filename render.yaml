services:
  - type: web
    name: chi-shen-me
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chi-shen-me-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
databases:
  - name: chi-shen-me-db
    plan: free
    postgresMajorVersion: "16"
